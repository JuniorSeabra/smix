services:
  - type: web
    name: smix-api
    runtime: node
    rootDir: apps/api
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run build
    startCommand: node dist/main.js
    envVars:
      # Banco no Neon (free permanente). Cole a connection string POOLED
      # (a que tem "-pooler" no host) no painel do Render — sync:false faz o
      # Render pedir o valor em vez de versioná-lo aqui.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: WEB_ORIGIN
        value: https://smix.vercel.app
